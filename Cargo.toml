[package]
name = "xsar-sensor-logger-display"
version = "0.2.0"
edition = "2021"
authors = ["Charlie <info@xsar.com.au>"]
description = "Oscilloscope-style comparison display for xSAR sensor harvester CSV logs"

[dependencies]
eframe = { version = "0.28", features = ["default", "wgpu"] }
egui_plot = "0.28"
csv = "1.4"
chrono = "0.4"
anyhow = "1.0"
rfd = "0.15"
