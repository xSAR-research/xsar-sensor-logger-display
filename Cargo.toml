[package]
name = "xsar-sensor-logger-display"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.28", features = ["default", "wgpu"] }
egui_plot = "0.28"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }