[package]
name = "xsar-sensor-logger-display"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.28", features = ["wgpu", "default"] }
egui = "0.28"
egui_plot = "0.28"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
rfd = "0.15"  # for file dialog
anyhow = "1.0"