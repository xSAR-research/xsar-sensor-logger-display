name: Version 2 CI

on:
  push:
    branches:
      - version-2

permissions:
  contents: write

jobs:
  check:
    name: Resolve lockfile, test, and lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out Version 2 branch
        uses: actions/checkout@v6
        with:
          ref: version-2

      - name: Install current stable Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - name: Resolve application dependency lockfile
        run: cargo generate-lockfile

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Commit resolved Cargo.lock
        run: |
          if [[ -n "$(git status --porcelain -- Cargo.lock)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "Version 2: commit resolved application lockfile"
            git push origin HEAD:version-2
          else
            echo "Cargo.lock is already current."
          fi
